name: slabik
services:
  slabik:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PRELOAD_MODEL: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3
volumes:
  model-cache:
